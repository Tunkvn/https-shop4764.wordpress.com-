<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://api.open-meteo.com; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#0F172A">
<meta name="mobile-web-app-capable" content="yes">
<title>Mon tableau de bord</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F172A'/%3E%3Cpath d='M18 33l10 10 18-22' fill='none' stroke='%2310B981' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F172A; --card:#1B2540; --card2:#243150; --line:#2E3B5C;
  --text:#F1F5F9; --muted:#94A3B8;
  --green:#10B981; --blue:#3B82F6; --amber:#F59E0B; --gray:#64748B; --red:#EF4444; --violet:#A78BFA;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding:0 16px calc(96px + env(safe-area-inset-bottom));}
main,header.top{max-width:560px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,p{margin:0}

/* En-tête */
header.top{padding:28px 0 8px}
.date{color:var(--muted);font-size:14px;font-weight:500;text-transform:capitalize}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
.weather{margin-top:14px;display:flex;align-items:center;gap:12px;background:var(--card);
  border-radius:var(--r);padding:12px 16px;box-shadow:0 6px 20px rgba(0,0,0,.25);min-height:64px}
.weather .ico{font-size:30px;line-height:1}
.weather .temp{font-size:24px;font-weight:700}
.weather .sub{color:var(--muted);font-size:13px}

/* Sections et cartes */
section{margin-top:30px;scroll-margin-top:12px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 6px 20px rgba(0,0,0,.25);margin-bottom:12px}
.card h3{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.muted{color:var(--muted)} .small{font-size:13px}
.empty{color:var(--muted);font-size:14px;padding:4px 0}

/* Boutons */
.add{width:44px;height:44px;border-radius:14px;background:var(--card2);font-size:22px;font-weight:500;
  display:grid;place-items:center;flex:none}
.add:active,.btn:active,.ib:active{transform:scale(.96)}
.btn{min-height:46px;padding:0 16px;border-radius:14px;background:var(--card2);font-weight:600;font-size:15px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.green{background:var(--green);color:#04241A} .btn.amber{background:rgba(245,158,11,.18);color:#FCD38A}
.btn.red{background:rgba(239,68,68,.16);color:#FCA5A5} .btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.full{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--muted);font-size:18px;flex:none}
.ib.on{color:var(--amber)}

/* Lignes à cocher */
.item{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .body{flex:1;min-width:0}
.item .t{font-weight:500;overflow-wrap:anywhere}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.chk{width:34px;height:34px;border-radius:11px;border:2px solid var(--gray);display:grid;place-items:center;flex:none;
  font-size:18px;font-weight:700;color:transparent;transition:background .2s,border-color .2s}
.chk.on{background:var(--green);border-color:var(--green);color:#04241A}
.chk.big{width:46px;height:46px;border-radius:15px;font-size:22px}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.pop{animation:pop .35s ease}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:3px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--muted);white-space:nowrap}
.badge.amber{background:rgba(245,158,11,.18);color:#FCD38A}
.badge.red{background:rgba(239,68,68,.2);color:#FCA5A5}
.badge.green{background:rgba(16,185,129,.18);color:#6EE7B7}
.badge.blue{background:rgba(59,130,246,.2);color:#93C5FD}
.jx{font-size:14px;padding:5px 11px}

.alert{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.45);color:#FCD38A;border-radius:var(--r);
  padding:14px 16px;margin-bottom:12px;font-size:14px}
.alert b{display:block;margin-bottom:2px;color:#FDE5B4}

/* Hors écran */
.sugg{font-size:20px;font-weight:600;letter-spacing:-.01em;margin:4px 0 14px}
.word .ru{font-size:22px;font-weight:700} .word .fr{color:var(--muted)}

/* Semaine */
.wknav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.wknav .lbl{flex:1;text-align:center;font-weight:600}
.day{background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.day.today{outline:2px solid var(--green)}
.day .dh{display:flex;justify-content:space-between;align-items:center;font-weight:600;margin-bottom:6px}
.day .dh .n{color:var(--muted);font-weight:500;font-size:13px}
.ev{display:flex;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:12px;margin-top:6px;
  border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.ev .h{font-size:12px;font-weight:600;width:76px;flex:none;color:var(--text);opacity:.9;padding-top:1px}
.ev .tt{font-size:14px;font-weight:500;overflow-wrap:anywhere}
.ev .ss{font-size:12px;color:var(--muted)}
.ev.cours{--c:var(--blue)} .ev.hop{--c:var(--amber)} .ev.rest{--c:var(--gray)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:2px 0 12px;flex-wrap:wrap}

/* Habitudes */
.habit{display:flex;gap:12px;align-items:flex-start}
.habit .body{flex:1;min-width:0}
.habit .nm{font-weight:600}
.grid7{display:flex;gap:5px;margin-top:10px}
.grid7 div{flex:1;max-width:34px;text-align:center;font-size:10px;color:var(--muted)}
.grid7 i{display:block;height:22px;border-radius:7px;background:var(--card2);margin-bottom:3px}
.grid7 i.on{background:var(--green)} .grid7 .now i{outline:2px solid var(--line);outline-offset:1px}
.streak{font-size:13px;font-weight:600;color:#6EE7B7;white-space:nowrap}
.field-inline{display:flex;align-items:center;gap:10px;margin-top:12px}
.field-inline input[type=number]{width:96px}
label.tick{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px;min-height:40px}

/* Champs */
input[type=text],input[type=password],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px;outline:none;color-scheme:dark}
input:focus,select:focus,textarea:focus{border-color:var(--green)}
textarea{min-height:84px;resize:vertical}

/* Objectifs et argent */
.goal{border-left:4px solid var(--green)}
.goal .gt{font-size:17px;font-weight:600}
.count{font-size:26px;font-weight:700;color:#6EE7B7;margin-top:6px}
.bar{height:12px;border-radius:99px;background:var(--card2);overflow:hidden;margin:12px 0 8px}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .5s ease}
.big{font-size:28px;font-weight:700;letter-spacing:-.02em}
.remind{display:flex;align-items:center;gap:10px;background:rgba(167,139,250,.12);border:1px solid rgba(167,139,250,.4);
  color:#DDD6FE;border-radius:var(--r);padding:12px 16px;margin-bottom:12px;font-weight:600}
.remind span{flex:1}
.link{color:var(--muted);font-size:13px;text-decoration:underline;padding:10px 0;min-height:40px}
details summary{color:var(--muted);font-size:14px;padding:8px 0;cursor:pointer}

/* Navigation du bas */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(15,23,42,.92);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bottom div{max-width:560px;margin:0 auto;display:flex}
nav.bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;color:var(--muted);
  text-decoration:none;font-size:11px;font-weight:500}
nav.bottom a.on{color:var(--green)}
nav.bottom svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Petite fenêtre */
.ov{position:fixed;inset:0;z-index:50;background:rgba(2,6,23,.65);display:none;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  max-height:90vh;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{font-size:18px;margin-bottom:14px}
.sheet label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px;font-weight:500}
.sheet .info{font-size:14px;color:var(--muted);margin-top:8px}
.sheet .acts{display:flex;gap:8px;margin-top:20px}
.sheet .acts .btn{flex:1}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:#F1F5F9;color:#0F172A;font-weight:600;font-size:14px;padding:10px 16px;border-radius:12px;opacity:0;
  transition:.25s;z-index:60;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
body.locked header.top,body.locked main,body.locked nav.bottom{display:none}
#lock{display:none;min-height:100vh;max-width:380px;margin:0 auto;flex-direction:column;justify-content:center;gap:14px;text-align:center}
body.locked #lock{display:flex}
#lock .ico{font-size:44px} #lock input{text-align:center;font-size:22px;letter-spacing:.2em}
#lockMsg{min-height:20px;font-size:14px;color:#FCA5A5}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body class="locked">

<form id="lock" autocomplete="off">
  <div class="ico">🔒</div>
  <h2>Tableau de bord verrouillé</h2>
  <input type="password" id="lockIn" placeholder="Ton code" autocomplete="off" aria-label="Code" required>
  <div id="lockMsg"></div>
  <button type="submit" class="btn green full" id="lockBtn">Ouvrir</button>
  <button type="button" class="link" id="lockForgot">Code oublié ?</button>
</form>

<header class="top">
  <div class="date" id="hDate"></div>
  <h1 id="hello">Bonjour</h1>
  <div class="weather" id="weather"></div>
</header>

<main>
  <section id="s-today"></section>
  <section id="s-off"></section>
  <section id="s-week"></section>
  <section id="s-tasks"></section>
  <section id="s-hw"></section>
  <section id="s-habits"></section>
  <section id="s-win"></section>
  <section id="s-goals"></section>
  <section id="s-money"></section>
  <section id="s-data"></section>
</main>

<nav class="bottom"><div>
  <a href="#s-today" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>Aujourd'hui</a>
  <a href="#s-week"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Semaine</a>
  <a href="#s-tasks"><svg viewBox="0 0 24 24"><path d="M4 6l2 2 3-3M4 13l2 2 3-3M4 20l2 2 3-3M13 7h7M13 14h7M13 21h7" transform="translate(0 -2)"/></svg>Tâches</a>
  <a href="#s-habits"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>Habitudes</a>
  <a href="#s-money"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M7 15h4"/></svg>Argent</a>
</div></nav>

<div class="ov" id="ov"><form class="sheet" id="sheet"></form></div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept=".json,application/json" hidden>

<script>
'use strict';
/* ============ Outils ============ */
const KEY = 'tableau_de_bord_v1', WKEY = 'tableau_de_bord_meteo', GKEY = 'tableau_de_bord_position';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const [a, b, c] = s.split('-').map(Number); return new Date(a, b - 1, c); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const today = () => ymd(new Date());
const diffDays = (a, b) => Math.round((parse(a) - parse(b)) / 864e5);
const uid = () => Math.random().toString(36).slice(2, 10);
const mondayOf = s => addDays(s, -((parse(s).getDay() + 6) % 7));
const fmt = (s, o) => parse(s).toLocaleDateString('fr-FR', o);
const money = n => Math.round(n).toLocaleString('fr-FR') + ' ₽';
const DOW = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
const CATS = { etudes: ['Études', 'var(--blue)'], hopital: ['Hôpital', 'var(--amber)'], perso: ['Perso', 'var(--green)'] };

/* ============ Données d'exemple ============ */
const EX_SUBJ = 'Cours (exemple)';
function seed() {
  const t = today(), SUBJ = EX_SUBJ, PROF = '', ROOM = '';
  const A = [['08:00', '09:35'], ['09:45', '11:20'], ['12:00', '13:35']], B = [['13:45', '15:20'], ['15:30', '17:05'], ['17:15', '18:50']];
  const courses = [];
  ['2026-11-16', '2026-11-18', '2026-11-20', '2026-11-21'].forEach(d => A.forEach(x => courses.push({ id: uid(), date: d, start: x[0], end: x[1], subject: SUBJ, teacher: PROF, room: ROOM })));
  ['2026-11-17', '2026-11-19'].forEach(d => B.forEach(x => courses.push({ id: uid(), date: d, start: x[0], end: x[1], subject: SUBJ, teacher: PROF, room: ROOM })));
  const habits = [
    { id: 'marche', name: 'Marcher', note: '20 min dehors', kind: 'check' },
    { id: 'russe', name: 'Russe', note: '10 mots sur papier', kind: 'check' },
    { id: 'sport', name: 'Sport', note: '15 min', kind: 'check' },
    { id: 'tel', name: 'Téléphone sous contrôle', note: '', kind: 'phone' },
    { id: 'coran', name: 'Coran', note: '½ page minimum, 1 page maximum', kind: 'check' }
  ];
  const log = {};
  [[1, ['marche', 'russe', 'coran'], 95], [2, ['marche', 'coran'], 140], [3, ['marche', 'russe', 'sport', 'coran'], 80], [4, ['russe'], 110], [5, ['marche', 'coran'], 60]]
    .forEach(([n, ids, min]) => { const o = { min }; ids.forEach(i => o[i] = true); log[addDays(t, -n)] = o; });
  return {
    v: 1, examples: true, fresh: true, name: '',
    tasks: [
      { id: uid(), title: 'Relire le conspect de chirurgie', cat: 'etudes', date: t, priority: true, done: false },
      { id: uid(), title: 'Préparer ma tenue pour la garde', cat: 'hopital', date: t, priority: true, done: false },
      { id: uid(), title: 'Appeler la famille', cat: 'perso', date: addDays(t, -1), priority: true, done: false },
      { id: uid(), title: 'Faire les courses', cat: 'perso', date: t, priority: false, done: false }
    ],
    courses, gardes: ['2026-11-18'], sundayGarde: true, gardeSkip: [],
    hw: [
      { id: uid(), type: 'Devoir', subject: 'История болезни — хирургия', due: addDays(t, 2), notes: 'Écrire au propre, phrases courtes.' },
      { id: uid(), type: 'Examen', subject: 'Зачёт (exemple)', due: addDays(t, 9), notes: '' },
      { id: uid(), type: 'Devoir', subject: 'Курсовая — plan', due: addDays(t, 24), notes: 'Montrer le plan au professeur.' }
    ],
    activities: [
      { id: uid(), text: 'Marcher 20 min dehors', rest: false },
      { id: uid(), text: 'Apprendre 10 mots russes sur papier', rest: false },
      { id: uid(), text: '15 min de sport', rest: false },
      { id: uid(), text: 'Cuisiner un vrai repas', rest: false },
      { id: uid(), text: 'Appeler quelqu\'un', rest: false },
      { id: uid(), text: 'Relire un conspect sur papier', rest: false },
      { id: uid(), text: 'Faire une sieste de 30 min, téléphone dans une autre pièce', rest: true },
      { id: uid(), text: 'Se coucher tôt ce soir', rest: true },
      { id: uid(), text: 'Prendre une douche chaude et s\'allonger 20 min', rest: true },
      { id: uid(), text: 'Boire un thé tranquille, sans écran', rest: true }
    ],
    words: [
      ['пульс', 'le pouls'], ['давление', 'la tension'], ['перевязка', 'le pansement'], ['укол', 'la piqûre'],
      ['капельница', 'la perfusion'], ['рана', 'la plaie'], ['шов', 'la suture'], ['боль', 'la douleur'],
      ['анализ крови', 'l\'analyse de sang'], ['палата', 'la chambre (d\'hôpital)'], ['обезболивающее', 'l\'antidouleur'],
      ['наркоз', 'l\'anesthésie générale'], ['шприц', 'la seringue'], ['бинт', 'la bande'], ['пролежень', 'l\'escarre'],
      ['каталка', 'le brancard'], ['судно', 'le bassin de lit'], ['дренаж', 'le drain']
    ].map(w => ({ id: uid(), ru: w[0], fr: w[1] })),
    sugg: { date: t, off: 0 },
    habits, log, phoneGoal: 120,
    wins: { [addDays(t, -1)]: 'J\'ai parlé russe avec un patient.', [addDays(t, -3)]: 'J\'ai marché 30 minutes après les cours.' },
    goals: [
      { id: uid(), title: 'Parler russe sans peur', note: 'Un peu chaque jour, même avec des fautes.', date: '' },
      { id: uid(), title: 'Retrouver confiance en moi', note: 'Noter une victoire par jour.', date: '' },
      { id: uid(), title: 'Obtenir mon diplôme', note: '', date: '2027-07-01' }
    ],
    debt: { initial: 150000, remaining: 150000, monthly: 30000, paid: {} },
    hide24: false, budgetOn: false, expenses: []
  };
}

/* ============ Stockage ============ */
let S, wk, flash = null;
function load(data) {
  S = (data && Array.isArray(data.tasks)) ? data : seed();
  S = Object.assign(seed0(), S); fixGardes();
}
function fixGardes() { S.gardes = S.gardes.map(g => typeof g === 'string' ? { date: g, start: '17:00', end: '08:00' } : g); }
function seed0() { // valeurs par défaut pour un fichier restauré incomplet
  return { tasks: [], courses: [], gardes: [], sundayGarde: true, gardeSkip: [], hw: [], activities: [], words: [], sugg: { date: '', off: 0 },
    habits: [], log: {}, phoneGoal: 120, wins: {}, goals: [], debt: { initial: 0, remaining: 0, monthly: 0, paid: {} }, hide24: false, budgetOn: false, expenses: [] };
}
let saveQ = Promise.resolve();
function save() {
  const txt = JSON.stringify(S), fail = () => toast('Impossible d\'enregistrer (mémoire pleine ?)');
  if (!ckey) { try { localStorage.setItem(KEY, txt); } catch (e) { fail(); } return; }
  saveQ = saveQ.then(async () => { try { localStorage.setItem(KEY, await encrypt(txt)); } catch (e) { fail(); } });
}

/* ============ Verrou : les données sont chiffrées avec ton code (AES-256) ============ */
let ckey = null, cmeta = null; // clé en mémoire seulement, jamais enregistrée
const canLock = !!(window.crypto && crypto.subtle);
const b64 = u => { let x = ''; for (const c of u) x += String.fromCharCode(c); return btoa(x); };
const unb64 = x => Uint8Array.from(atob(x), c => c.charCodeAt(0));
async function deriveKey(code, salt, iter) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: unb64(salt), iterations: Math.min(Number(iter) || 1, 2e6), hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encrypt(txt) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, ckey, new TextEncoder().encode(txt)));
  return JSON.stringify({ enc: 1, salt: cmeta.salt, iter: cmeta.iter, iv: b64(iv), ct: b64(ct) });
}
async function decrypt(rec, key) {
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(rec.iv) }, key, unb64(rec.ct))));
}
async function setCode(code) {
  const meta = { salt: b64(crypto.getRandomValues(new Uint8Array(16))), iter: 300000 };
  const k = await deriveKey(code, meta.salt, meta.iter);
  await saveQ; ckey = k; cmeta = meta; save(); render(); toast('Code activé. Tes données sont chiffrées.');
}
function codeForm() {
  openForm({ title: ckey ? 'Changer le code' : 'Protéger par un code', saveLabel: 'Activer', fields: [
    { key: 'code', label: 'Nouveau code (4 caractères minimum, chiffres ou lettres)', type: 'password' },
    { key: 'code2', label: 'Répète le code', type: 'password' },
    { type: 'info', html: 'Un code plus long protège mieux (8 caractères ou plus, c\'est bien).<br><b style="color:#FCA5A5">Attention : si tu oublies ce code, personne ne peut récupérer tes données, même pas moi.</b>' }],
    onSave: v => {
      if (v.code.length < 4) { toast('Le code doit avoir au moins 4 caractères.'); return false; }
      if (v.code !== v.code2) { toast('Les deux codes ne sont pas pareils.'); return false; }
      setCode(v.code).catch(() => toast('Impossible d\'activer le code.'));
    } });
}
function showLock(rec) {
  const inp = $('#lockIn'), msg = $('#lockMsg'), btn = $('#lockBtn');
  if (!canLock) { msg.textContent = 'Ce navigateur ne peut pas déchiffrer ici. Ouvre la page en ligne (https).'; return; }
  inp.focus();
  $('#lock').addEventListener('submit', async e => {
    e.preventDefault(); if (btn.disabled) return;
    btn.disabled = true; msg.textContent = ''; btn.textContent = 'Vérification…';
    try {
      const k = await deriveKey(inp.value, rec.salt, rec.iter), data = await decrypt(rec, k);
      ckey = k; cmeta = { salt: rec.salt, iter: rec.iter }; inp.value = ''; load(data); start();
    } catch (x) { msg.textContent = 'Code incorrect.'; inp.value = ''; inp.focus(); }
    btn.disabled = false; btn.textContent = 'Ouvrir';
  });
  $('#lockForgot').addEventListener('click', () => {
    if (confirm('Sans le code, les données sont illisibles.\n\nLa seule solution est de TOUT EFFACER sur ce téléphone et de recommencer (tu pourras ensuite restaurer une sauvegarde).\n\nTout effacer ?') && confirm('Vraiment tout effacer ? C\'est définitif.')) {
      try { localStorage.removeItem(KEY); } catch (x) {} location.reload();
    }

}
function rollover() {
  const t = today();
  S.tasks.forEach(k => { if (!k.done && k.date < t) { k.date = t; k.carried = true; } });
  S.tasks = S.tasks.filter(k => !(k.done && k.doneDate && diffDays(t, k.doneDate) > 30));
}
function toast(m) { const e = $('#toast'); e.textContent = m; e.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('show'), 2400); }

/* ============ Planning : gardes, cours, conflits ============ */
function getGarde(d) { // la garde qui commence ce jour-là (ou rien)
  const g = S.gardes.find(x => x.date === d);
  if (g) return g;
  if (S.sundayGarde && parse(d).getDay() === 0 && !S.gardeSkip.includes(d)) return { date: d, start: '08:00', end: '08:00', auto: true }; // dimanche : 24 h
  return null;
}
const hasGarde = d => !!getGarde(d);
const overnight = g => g.end <= g.start; // finit le lendemain
function dayEvents(d) {
  const ev = [], y = addDays(d, -1), gy = getGarde(y), g = getGarde(d);
  if (gy && overnight(gy)) {
    ev.push({ type: 'hop', start: '00:00', end: gy.end, h: '→ ' + gy.end, title: 'Fin de garde', sub: 'commencée hier à ' + gy.start, garde: y });
    ev.push({ type: 'rest', start: gy.end, end: gy.end, h: gy.end < '12:00' ? 'Matinée' : 'Ensuite', title: 'Repos', sub: 'après la garde' });
  }
  S.courses.filter(c => c.date === d).forEach(c => ev.push({ type: 'cours', start: c.start, end: c.end, h: c.start + '–' + c.end, title: c.subject, sub: [c.teacher, c.room].filter(Boolean).join(' · '), id: c.id }));
  if (g) ev.push(overnight(g)
    ? { type: 'hop', start: g.start, end: '24:00', h: g.start + ' →', title: 'Garde à l\'hôpital', sub: 'jusqu\'à demain ' + g.end, garde: d }
    : { type: 'hop', start: g.start, end: g.end, h: g.start + '–' + g.end, title: 'Travail à l\'hôpital', sub: '', garde: d });
  return ev.sort((a, b) => a.start.localeCompare(b.start) || (a.type === 'rest') - (b.type === 'rest'));
}
function conflicts(d) {
  const ev = dayEvents(d).filter(e => e.type !== 'rest'), out = [];
  const nm = e => e.type === 'cours' ? 'le cours de ' + e.start : (e.start === '00:00' ? 'la garde (fin à ' + e.end + ')' : 'le travail à l\'hôpital (début à ' + e.start + ')');
  for (let i = 0; i < ev.length; i++) for (let j = i + 1; j < ev.length; j++) {
    const a = ev[i], b = ev[j];
    if (a.start < b.end && b.start < a.end) out.push('Chevauchement : ' + nm(a) + ' et ' + nm(b) + '.');
    else if (a.end === b.start && a.type !== b.type) out.push('Aucune pause : ' + nm(a) + ' se termine à ' + a.end + ' et ' + nm(b) + ' commence à ' + b.start + '.');
  }
  return out;
}
const dayKind = d => { const y = getGarde(addDays(d, -1)); return hasGarde(d) ? 'garde' : (y && overnight(y)) ? 'sortie' : 'normal'; };

/* ============ Tâches ============ */
const isActive = (k, t) => k.date <= t && (!k.done || k.doneDate === t);
const prioList = t => S.tasks.filter(k => k.priority && isActive(k, t));
function taskRow(k) {
  const c = CATS[k.cat] || CATS.perso;
  return `<div class="item ${k.done ? 'done' : ''}">
    <button type="button" class="chk ${k.done ? 'on' : ''}" data-a="taskToggle" data-id="${k.id}" data-fx="t${k.id}" aria-label="Cocher">✓</button>
    <div class="body"><div class="t">${esc(k.title)}</div>
      <div class="meta"><span class="dot" style="background:${c[1]}"></span>${c[0]}
      ${k.carried && !k.done ? '<span class="badge amber">reportée</span>' : ''}${k.date > today() ? '<span class="badge">' + fmt(k.date, { day: 'numeric', month: 'short' }) + '</span>' : ''}</div></div>
    <button type="button" class="ib ${k.priority ? 'on' : ''}" data-a="taskPrio" data-id="${k.id}" aria-label="Prioritaire">${k.priority ? '★' : '☆'}</button>
    <button type="button" class="ib" data-a="taskEdit" data-id="${k.id}" aria-label="Modifier">✎</button></div>`;
}
function jx(due) {
  const n = diffDays(due, today());
  const txt = n < 0 ? 'Passé' : n === 0 ? 'Aujourd\'hui' : 'J-' + n;
  return `<span class="badge jx ${n <= 2 ? 'red' : 'blue'}">${txt}</span>`;
}

/* ============ Habitudes ============ */
function habitDone(h, d) {
  const l = S.log[d] || {};
  return h.kind === 'phone' ? (l.min != null && l.min < S.phoneGoal) : !!l[h.id];
}
function streak(h) {
  let d = today(), n = 0;
  if (!habitDone(h, d)) d = addDays(d, -1);
  while (habitDone(h, d)) { n++; d = addDays(d, -1); }
  return n;
}
function grid7(h) {
  const t = today(); let s = '<div class="grid7">';
  for (let i = 6; i >= 0; i--) { const d = addDays(t, -i); s += `<div class="${i === 0 ? 'now' : ''}"><i class="${habitDone(h, d) ? 'on' : ''}"></i>${DOW[(parse(d).getDay() + 6) % 7][0]}</div>`; }
  return s + '</div>';
}

      <label class="tick"><button type="button" class="chk ${paid ? 'on' : ''}" data-a="debtPay" data-fx="pay" aria-label="Cocher">✓</button>Payé ce mois-ci (${fmt(t, { month: 'long' })})</label></div>

let formCb = null;
function openForm({ title, fields, onSave, onDelete, saveLabel }) {
  const sh = $('#sheet');
  sh.innerHTML = `<h3>${esc(title)}</h3>` + fields.map(f => {
    if (f.type === 'info') return `<div class="info">${f.html}</div>`;
    if (f.type === 'checkbox') return `<label class="tick"><input type="checkbox" name="${f.key}" ${f.value ? 'checked' : ''} style="width:24px;height:24px;accent-color:#10B981">${esc(f.label)}</label>`;
    const lab = `<label class="f" for="f_${f.key}">${esc(f.label)}</label>`;
    if (f.type === 'select') return lab + `<select id="f_${f.key}" name="${f.key}">${f.options.map(o => `<option value="${esc(o[0])}" ${o[0] === f.value ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`;
    if (f.type === 'textarea') return lab + `<textarea id="f_${f.key}" name="${f.key}">${esc(f.value)}</textarea>`;
    return lab + `<input id="f_${f.key}" type="${f.type || 'text'}" name="${f.key}" value="${esc(f.value ?? '')}" ${f.required ? 'required' : ''} ${f.type === 'number' ? 'inputmode="numeric" min="0" step="any"' : ''} ${f.type === 'password' ? 'autocomplete="new-password" required' : ''} ${f.lang ? `lang="${f.lang}"` : ''}>`;
  }).join('') + `<div class="acts">${onDelete ? '<button type="button" class="btn red" data-a="formDel">Supprimer</button>' : ''}
    <button type="button" class="btn ghost" data-a="formClose">${onSave ? 'Annuler' : 'Fermer'}</button>${onSave ? `<button type="submit" class="btn green">${saveLabel || 'Enregistrer'}</button>` : ''}</div>`;
  formCb = { onSave, onDelete, fields };
  $('#ov').classList.add('open');
}
function closeForm() { $('#ov').classList.remove('open'); formCb = null; }
$('#sheet').addEventListener('submit', e => {
  e.preventDefault(); if (!formCb || !formCb.onSave) return;
  const v = {};
  formCb.fields.forEach(f => { if (f.type === 'info') return; const i = e.target.elements[f.key]; v[f.key] = f.type === 'checkbox' ? i.checked : f.type === 'number' ? (i.value === '' ? 0 : Number(i.value)) : f.type === 'password' ? i.value : i.value.trim(); });
  const cb = formCb.onSave; if (cb(v) === false) return;
  closeForm(); render();
});

/* ============ Météo (Open-Meteo, sans clé) ============ */
function wxInfo(c) {
  if (c === 0) return ['☀️', 'Ciel dégagé']; if (c <= 2) return ['🌤️', 'Peu nuageux']; if (c === 3) return ['☁️', 'Couvert'];
  if (c <= 48) return ['🌫️', 'Brouillard']; if (c <= 57) return ['🌦️', 'Bruine']; if (c <= 67) return ['🌧️', 'Pluie'];
  if (c <= 77) return ['❄️', 'Neige']; if (c <= 82) return ['🌧️', 'Averses']; if (c <= 86) return ['🌨️', 'Averses de neige']; return ['⛈️', 'Orage'];
}
const geoOn = () => { try { return localStorage.getItem(GKEY) === '1'; } catch (e) { return false; } };
const geoBtn = () => `<button type="button" class="ib ${geoOn() ? 'on' : ''}" data-a="geo" aria-label="Utiliser ma position" title="Utiliser ma position">📍</button>`;
function getPos() {
  return new Promise((ok, ko) => {
    if (!navigator.geolocation) return ko();
    navigator.geolocation.getCurrentPosition(p => ok(p.coords), ko, { timeout: 10000, maximumAge: 30 * 60e3 });
  });
}
function showWx(w, stale) {
  const i = wxInfo(w.code), r = n => (n > 0 ? '+' : '') + Math.round(n) + '°';
  $('#weather').innerHTML = `<div class="ico">${i[0]}</div><div style="flex:1"><div class="temp">${r(w.t)} <span class="sub">ressenti ${r(w.f)}</span></div>
    <div class="sub">${esc(w.place || 'Krasnoyarsk')} · ${i[1]}${stale ? ' · mesure de ' + new Date(w.at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : ''}</div></div>
    ${stale ? '<button type="button" class="ib" data-a="meteo" aria-label="Réessayer">↻</button>' : ''}${geoBtn()}`;
}
async function weather(force) {
  let cache = null; try { cache = JSON.parse(localStorage.getItem(WKEY)); } catch (e) {}
  if (cache && !!cache.geo !== geoOn()) cache = null;
  if (cache && !force && Date.now() - cache.at < 20 * 60e3) return showWx(cache, false);
  $('#weather').innerHTML = '<div class="sub">Météo en cours de chargement…</div>';
  let lat = 56.01, lon = 92.87, place = 'Krasnoyarsk';
  if (geoOn()) {
    try { const c = await getPos(); lat = c.latitude.toFixed(2); lon = c.longitude.toFixed(2); place = 'Ma position'; }
    catch (e) {
      if (e && e.code === 1) { try { localStorage.removeItem(GKEY); } catch (x) {} toast('Position refusée. J\'affiche Krasnoyarsk.'); }
      else toast('Position introuvable. J\'affiche Krasnoyarsk.');
    }
  }
  try {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 8000);
    const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&current=temperature_2m,apparent_temperature,weather_code&timezone=auto', { signal: ctl.signal });
    clearTimeout(to); if (!res.ok) throw 0;
    const c = (await res.json()).current, w = { t: c.temperature_2m, f: c.apparent_temperature, code: c.weather_code, at: Date.now(), place, geo: place !== 'Krasnoyarsk' };
    if (typeof w.t !== 'number') throw 0;
    if (w.geo === geoOn()) { try { localStorage.setItem(WKEY, JSON.stringify(w)); } catch (e) {} }
    showWx(w, false);
  } catch (e) {
    if (cache) showWx(cache, true);
    else $('#weather').innerHTML = '<div class="ico">🌡️</div><div style="flex:1"><div style="font-weight:600">Météo indisponible</div><div class="sub">Pas de connexion pour le moment.</div></div><button type="button" class="ib" data-a="meteo" aria-label="Réessayer">↻</button>' + geoBtn();
  }
}

/* ============ Démarrage ============ */
let lastDay = today(), hiddenAt = 0;
function start() {
  rollover(); wk = mondayOf(today()); lastDay = today(); render(); weather();
  document.body.classList.remove('locked');
  if (!S.name) nameForm();
}
(() => {
  let raw = null; try { raw = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (raw && raw.enc) showLock(raw); else { load(raw); start(); }
})();
document.addEventListener('visibilitychange', () => {
  if (!S) return;
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (ckey && hiddenAt && Date.now() - hiddenAt > 120e3) return saveQ.then(() => location.reload()); // verrouillage automatique
  if (today() !== lastDay) { lastDay = today(); rollover(); wk = mondayOf(lastDay); render(); }
  weather();
});
if ('IntersectionObserver' in window) {
  const links = [...document.querySelectorAll('nav.bottom a')], ids = links.map(a => a.getAttribute('href').slice(1));
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    let i = -1; const all = [...document.querySelectorAll('main section')].map(s => s.id), pos = all.indexOf(e.target.id);
    all.slice(0, pos + 1).forEach(id => { if (ids.includes(id)) i = ids.indexOf(id); });
    links.forEach((a, k) => a.classList.toggle('on', k === Math.max(i, 0)));
  }), { rootMargin: '-30% 0px -60% 0px' });
  document.querySelectorAll('main section').forEach(s => io.observe(s));
}
</script>
